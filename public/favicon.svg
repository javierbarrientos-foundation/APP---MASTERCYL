<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E1B32"/>
      <stop offset="100%" stop-color="#670E1D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base redondeada institucional Salamanca -->
  <rect x="6" y="6" width="180" height="180" rx="42" fill="url(#bgGrad)" stroke="#EAB308" stroke-width="4.5"/>

  <!-- Birrete académico y borla de honor -->
  <g filter="url(#shadow)">
    <!-- Base / casquete inferior del birrete -->
    <path d="M60 84 L60 112 C60 128 132 128 132 112 L132 84 L96 99 Z" fill="#F8FAFC"/>
    <!-- Casquete interior sombreado -->
    <path d="M64 86 L64 110 C64 124 128 124 128 110 L128 86 L96 99 Z" fill="#E2E8F0" opacity="0.6"/>
    <!-- Parte superior diamante del birrete -->
    <path d="M96 42 L159 70.5 L96 99 L33 70.5 Z" fill="#FFFFFF"/>
    <!-- Detalle interior diamante -->
    <path d="M96 51 L144 70.5 L96 90 L48 70.5 Z" fill="#F1F5F9" opacity="0.5"/>
    <!-- Borla dorada -->
    <path d="M96 70.5 L138 79.5 L142.5 114" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="142.5" cy="117" r="6.5" fill="url(#goldGrad)"/>
    <circle cx="96" cy="70.5" r="5.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Laurel / Libro de postgrado en oro -->
  <path d="M51 141 C72 132 88.5 138 96 145.5 C103.5 138 120 132 141 141 L141 149.5 C120 140.5 103.5 146.5 96 154.5 C88.5 146.5 72 140.5 51 149.5 Z" fill="url(#goldGrad)" filter="url(#shadow)"/>
</svg>
